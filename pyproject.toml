[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-capability-benchmark"
version = "0.1.0.dev0"
description = "Vendor-neutral evaluation of capability infrastructure for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pre-commit>=4.6,<5",
  "pytest>=9.1,<10",
  "ruff>=0.16.5,<1",
]

[project.scripts]
capability-bench = "agent_capability_benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_capability_benchmark"]
force-include = { "spec" = "agent_capability_benchmark/spec", "tasks/public" = "agent_capability_benchmark/tasks/public" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
